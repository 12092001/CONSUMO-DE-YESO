<style>
:root{--bg:#f3f1ec;--card:#fff;--ink:#1d2533;--mut:#667085;--line:#e3e0d8;--pri:#1f4e8c;--pri2:#e8eef7;--est:#8ea3bf;--real:#d9822b;--rec:#2f8f6b;--bad:#c2410c;--warn:#a16207;--hdr:#1f2f46}
*{box-sizing:border-box}
html,body{margin:0}

.top{position:sticky;top:0;z-index:30;background:var(--hdr);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));flex-wrap:wrap}

nav#tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(7,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav#tabs button{border:0;background:none;padding:8px 1px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;letter-spacing:-.2px;color:var(--mut);cursor:pointer;min-height:58px;font-family:inherit}

@media(min-width:900px){
 body{padding-bottom:30px}
 nav#tabs{position:static;display:flex;justify-content:center;gap:4px;border-top:0;border-bottom:1px solid var(--line);padding:6px}
 nav#tabs button{flex-direction:row;font-size:14px;min-height:0;padding:9px 16px;border-radius:10px;gap:8px}
 nav#tabs button.on{background:var(--pri2)}
}
main{max-width:1180px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;min-width:0}

@media(min-width:900px){.cols2{grid-template-columns:1fr 1fr}.cols2>.card{margin-bottom:0}.cols2{margin-bottom:12px}}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}

.btn{border:1px solid #d6d2c8;background:#fff;color:var(--ink);border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;min-height:42px;font-family:inherit;touch-action:manipulation}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.lnk{background:none;border:0;padding:0;color:var(--pri);font-weight:700;font:inherit;font-weight:700;cursor:pointer;text-align:left}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:900px){.grid.g4{grid-template-columns:repeat(4,minmax(0,1fr))}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut);min-width:0}

input,select,textarea{font:inherit;font-size:16px;padding:9px 10px;border:1px solid #d6d2c8;border-radius:10px;background:#fff;color:var(--ink);width:100%;min-width:0;min-height:42px}
input:focus,select:focus,textarea:focus{outline:2px solid #9db8e0;border-color:var(--pri)}

th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:#fff;z-index:1;white-space:normal;min-width:120px}
thead th{background:#f7f5f0;font-size:12px;color:var(--mut);font-weight:600}
thead th:first-child{background:#f7f5f0}
tr.tot td{font-weight:700;background:#f4f7fb}
tr.tot td:first-child{background:#f4f7fb}
td small{display:block;color:var(--mut);font-size:11px}

.pc{width:64px;padding:5px 6px;font-size:15px;text-align:right;min-height:34px;border-radius:8px}
.pc:not(:placeholder-shown){background:#fff8e6;border-color:#e8c97a}
.chart{width:100%;height:auto;display:block}

.seg{display:inline-flex;border:1px solid #d6d2c8;border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--mut);min-height:36px}
.seg button.on{background:var(--pri);color:#fff;font-weight:700}
.nav3{display:flex;align-items:center;gap:6px}
.nav3 b{min-width:120px;text-align:center}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .m{min-width:0}
.li .m small{display:block;color:var(--mut);font-size:12px}
.li .v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.dayh{font-size:12px;color:var(--mut);font-weight:700;margin:12px 0 2px;text-transform:capitalize}
.bd{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.bd.Pendiente{background:#e8eef7;color:#1f4e8c}.bd.Atrasada{background:#fde4d8;color:#9a3412}.bd.Parcial{background:#fff1cc;color:#7a5200}.bd.Recibida{background:#dcf3e8;color:#14603f}.bd.Cancelada{background:#eee;color:#666}
.pcard{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
.pcard .t{display:flex;justify-content:space-between;gap:8px;align-items:center}
.pcard .t b{font-size:16px}
.pcard .meta{color:var(--mut);font-size:13px;margin:6px 0;line-height:1.5}
.pg{height:8px;background:#ece9e2;border-radius:9px;overflow:hidden;margin:6px 0}
.pg i{display:block;height:100%;background:var(--rec)}
.recs{font-size:12.5px;color:var(--mut);margin:4px 0 8px}
.recs span{display:inline-flex;align-items:center;gap:4px;background:#f1f6f3;border-radius:8px;padding:2px 4px 2px 8px;margin:2px 4px 2px 0}
.recs button{border:0;background:none;color:var(--bad);font-size:15px;cursor:pointer;padding:0 4px;min-height:24px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal .dh{text-align:center;font-size:11px;color:var(--mut);font-weight:700;padding:4px 0}
.cd{min-height:66px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:3px;font-size:11px;cursor:pointer;overflow:hidden;min-width:0}
.cd b{font-size:12px}
.stbar{height:10px;background:#ece9e2;border-radius:9px;overflow:hidden;position:relative;margin:8px 0 4px}.stbar i{display:block;height:100%;border-radius:9px}.stbar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:#c2410c}
.mv-in{color:#2f8f6b}.mv-out{color:#c2410c}.mv-aj{color:#a16207}
.cd.o{opacity:.4}
.cd.t{box-shadow:inset 0 0 0 2px var(--pri)}
.cd.s{background:var(--pri2)}
.ev{display:block;border-radius:4px;padding:1px 3px;margin-top:2px;color:#fff;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.sol{background:#8a94a6}.ev.esp{background:var(--pri)}.ev.atr{background:var(--bad)}.ev.rec{background:var(--rec)}
.more{font-size:10px;color:var(--mut)}
@media(max-width:620px){.cd{min-height:52px}.ev{font-size:0;height:6px;padding:0;margin-top:3px}.more{display:none}}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:8px 0}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.modal{position:fixed;inset:0;z-index:60;background:rgba(15,23,35,.5);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.mbox{background:#fff;width:100%;max-width:580px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal{align-items:center}.mbox{border-radius:18px}}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mh h3{margin:0;font-size:17px}
.x{border:0;background:#f1efe9;border-radius:10px;width:38px;height:38px;font-size:22px;cursor:pointer;color:var(--mut)}
.merr{color:var(--bad);font-size:13px;min-height:4px;margin:8px 0 0}
.mf{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#1d2533;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:70;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.chk{display:flex;flex-wrap:wrap;gap:6px}
.chk label{display:inline-flex;align-items:center;gap:5px;border:1px solid #d6d2c8;border-radius:10px;padding:6px 10px;font-size:14px;cursor:pointer;background:#fff}
.chk input{width:auto;min-height:0}
.empty{color:var(--mut);text-align:center;padding:20px 8px;font-size:14px}
.formula{background:#f7f5f0;border-radius:10px;padding:10px 12px;font-size:13px;color:#444;margin-bottom:10px;line-height:1.5}
.note{font-size:12.5px;color:var(--mut);line-height:1.5}
code{background:#f1efe9;padding:1px 5px;border-radius:5px;font-size:12px;word-break:break-all}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="logo">Y</div><div><h1>Consumo de Yeso</h1><small id="sub">Fabricación de moldes</small></div></div>
  <div class="topR"><select id="matSel" aria-label="Material"></select><button class="btn hd" data-a="xls">⬇ Excel</button><span id="sync" class="chip">Local</span></div>
</header>
<nav id="tabs"></nav>
<main id="main"></main>
<div id="modal" class="modal" hidden></div>
<div id="toast"></div>
<input type="file" id="impFile" accept=".json,application/json" hidden>
<script>
(function(){
'use strict';
var LS='consumoYeso_v1',LSU='consumoYeso_ui',LSS='consumoYeso_sync';
var MES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
var MESL=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
var DIAS=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
function $(s){return document.querySelector(s)}
function pad(n){return String(n).padStart(2,'0')}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(v){var n=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(n)?n:0}
function fmt(n,d){d=d||0;return (isFinite(n)?n:0).toLocaleString('es-MX',{minimumFractionDigits:d,maximumFractionDigits:d})}
function uid(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4)}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function pd(s){var a=String(s).split('-').map(Number);return new Date(Date.UTC(a[0],(a[1]||1)-1,a[2]||1))}
function ymd(d){return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
function addD(s,n){var d=pd(s);d.setUTCDate(d.getUTCDate()+n);return ymd(d)}
function dow(s){return pd(s).getUTCDay()}
function wkStart(s){return addD(s,-((dow(s)+6)%7))}
function isoWeek(s){var d=pd(s);var day=(d.getUTCDay()+6)%7;d.setUTCDate(d.getUTCDate()-day+3);var y=d.getUTCFullYear();var f=new Date(Date.UTC(y,0,4));return {y:y,w:1+Math.round(((d-f)/864e5-3+((f.getUTCDay()+6)%7))/7)}}
function fdate(s){return s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'—'}
function fdateS(s){return s?(+s.slice(8,10))+' '+MES[+s.slice(5,7)-1]:'—'}
function dim(y,m){return new Date(Date.UTC(y,m+1,0)).getUTCDate()}
function diffDays(a,b){return Math.round((pd(b)-pd(a))/864e5)}
function isDate(s){return /^\d{4}-\d{2}-\d{2}$/.test(String(s||''))}

/* ================= ESTADO ================= */
var cache={};
function blank(){var t=today();return {v:1,ejemplo:false,updatedAt:0,config:{merma:5,diasLab:[1,2,3,4,5,6],leadTime:14,planta:''},materiales:[{id:'m1',nombre:'Yeso para moldes',kgSaco:25,stockIni:0,fechaIni:t.slice(0,8)+'01',minimo:0}],modelos:[],plan:{},pos:[],consumos:[],ajustes:[]}}
function norm(o){var b=blank();o.config=Object.assign(b.config,o.config||{});if(!Array.isArray(o.config.diasLab))o.config.diasLab=b.config.diasLab;['materiales','modelos','pos','consumos','ajustes'].forEach(function(k){if(!Array.isArray(o[k]))o[k]=o[k]&&typeof o[k]==='object'?Object.keys(o[k]).map(function(x){return o[k][x]}):[]});o.materiales=o.materiales.filter(Boolean);o.modelos=o.modelos.filter(Boolean);o.pos=o.pos.filter(Boolean);o.consumos=o.consumos.filter(Boolean);o.ajustes=o.ajustes.filter(Boolean);if(!o.plan||typeof o.plan!=='object')o.plan={};o.pos.forEach(function(p){if(!p.recibos)p.recibos=[];if(!Array.isArray(p.recibos))p.recibos=Object.keys(p.recibos).map(function(x){return p.recibos[x]});p.recibos=p.recibos.filter(Boolean)});if(!o.materiales.length)o.materiales=b.materiales;return o}
function ejemplo(){
  var t=today(),ty=+t.slice(0,4),tm=+t.slice(5,7)-1,pm=tm===0?11:tm-1,py=tm===0?ty-1:ty;
  var ini=py+'-'+pad(pm+1)+'-01';
  var o=blank();o.ejemplo=true;
  o.materiales=[{id:'m1',nombre:'Yeso cerámico',kgSaco:25,stockIni:9000,fechaIni:ini,minimo:6000}];
  o.modelos=[
    {id:'md1',nombre:'Taza (juego completo)',materialId:'m1',kgPorMolde:180,moldesMes:30},
    {id:'md2',nombre:'Tanque',materialId:'m1',kgPorMolde:90,moldesMes:20},
    {id:'md3',nombre:'Anillo',materialId:'m1',kgPorMolde:40,moldesMes:25},
    {id:'md4',nombre:'Lavabo',materialId:'m1',kgPorMolde:70,moldesMes:15}];
  var i=0;
  for(var d=ini;d<t;d=addD(d,1)){
    if(dow(d)===0)continue;i++;
    var q={md1:i%5===0?2:1,md2:i%4===3?0:1,md3:i%13===0?0:1,md4:i%2};
    o.modelos.forEach(function(m){var n=q[m.id];if(n>0)o.consumos.push({id:uid(),fecha:d,modeloId:m.id,materialId:'m1',moldes:n,kg:Math.round(n*m.kgPorMolde*(1.02+(i%5)*0.012)),nota:''})});
  }
  o.pos=[
    {id:uid(),numero:'PO-4501',proveedor:'Proveedor ejemplo',materialId:'m1',fechaSol:addD(ini,-6),fechaEsp:addD(ini,8),sacos:400,cancelada:false,nota:'',recibos:[{id:uid(),fecha:addD(ini,9),sacos:400}]},
    {id:uid(),numero:'PO-4502',proveedor:'Proveedor ejemplo',materialId:'m1',fechaSol:addD(ini,10),fechaEsp:addD(ini,23),sacos:400,cancelada:false,nota:'Entrega en dos partes',recibos:[{id:uid(),fecha:addD(ini,24),sacos:240}]},
    {id:uid(),numero:'PO-4503',proveedor:'Proveedor ejemplo',materialId:'m1',fechaSol:addD(t,-9),fechaEsp:addD(t,3),sacos:400,cancelada:false,nota:'',recibos:[]},
    {id:uid(),numero:'PO-4504',proveedor:'Proveedor ejemplo',materialId:'m1',fechaSol:addD(t,-1),fechaEsp:addD(t,20),sacos:400,cancelada:false,nota:'',recibos:[]}];
  return o;
}
function load(){try{var r=localStorage.getItem(LS);if(r){var o=JSON.parse(r);if(o&&o.materiales)return norm(o)}}catch(e){}return ejemplo()}
var S=load();
var UI=(function(){var t=today(),d={tab:'res',mat:'all',year:+t.slice(0,4),calMonth:t.slice(0,7),calSel:t,consMonth:t.slice(0,7),poF:'abiertas',lastMod:''};try{var u=JSON.parse(localStorage.getItem(LSU));if(u)d=Object.assign(d,u)}catch(e){}return d})();
function saveUI(){try{localStorage.setItem(LSU,JSON.stringify(UI))}catch(e){}}
function save(noSync){S.updatedAt=Date.now();cache={};try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast('No se pudo guardar en este navegador')}if(!noSync)Sync.push()}

/* ================= CÁLCULOS ================= */
function matById(id){return S.materiales.find(function(m){return m.id===id})}
function modById(id){return S.modelos.find(function(m){return m.id===id})}
function mats(){return S.materiales.filter(function(m){return UI.mat==='all'||m.id===UI.mat})}
function mods(){return S.modelos.filter(function(m){return UI.mat==='all'||m.materialId===UI.mat})}
function kgSacoRef(){var s={};mats().forEach(function(m){s[num(m.kgSaco)]=1});var k=Object.keys(s);return k.length===1&&+k[0]>0?+k[0]:0}
function moldesPlan(md,y,m){var p=S.plan[y]&&S.plan[y][md.id];var v=p?p[m]:undefined;return (v===null||v===undefined||v==='')?num(md.moldesMes):num(v)}
function kgMolde(md){return num(md.kgPorMolde)*(1+num(S.config.merma)/100)}

function niceMax(v){if(v<=0)return 1;var p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}

  for(var i=0;i<=4;i++){var y=T+ih*(1-i/4);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="#ebe7de"/><text x="'+(L-5)+'" y="'+(y+4)+'" text-anchor="end" class="ax">'+short(max*i/4)+'</text>'}
  var step=Math.ceil(n/13);
  o.labels.forEach(function(lb,i){o.series.forEach(function(s,j){var v=s.values[i]||0,h=v>0?Math.max(1,v/max*ih):0,x=L+gw*i+(gw-bw*k)/2+bw*j;
    g+='<rect x="'+x.toFixed(1)+'" y="'+(T+ih-h).toFixed(1)+'" width="'+Math.max(1,bw-1.5).toFixed(1)+'" height="'+h.toFixed(1)+'" rx="1.5" fill="'+s.color+'"><title>'+esc(lb)+' · '+esc(s.name)+': '+fmt(v)+' kg</title></rect>'});

function lineChart(o){var W=480,H=o.h||220,L=40,R=8,T=12,B=24,ih=H-T-B,iw=W-L-R,all=[];o.series.forEach(function(s){all=all.concat(s.values.filter(function(v){return v!=null}))});

  o.series.forEach(function(s){var d='';s.values.forEach(function(v,i){if(v==null)return;d+=(d?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)});

  out.sort(function(a,b){return a.f<b.f?-1:a.f>b.f?1:a.o-b.o});var s=0;out.forEach(function(x){s+=x.kg;x.saldo=s});return out}
function invSemanas(a,b,list){list=list||mats();var ids={};list.forEach(function(m){ids[m.id]=1});var mv=movimientos(list),out=[];
  for(var s=wkStart(a);s<=b;s=addD(s,7)){var e=addD(s,6),r={s:s,e:e,label:'S'+pad(isoWeek(s).w),ini:0,ent:0,sal:0,aj:0,fin:0,cur:s<=today()&&today()<=e};
    mv.forEach(function(x){if(x.f<s){r.ini+=x.kg}else if(x.f<=e){if(x.o===1)r.ent+=x.kg;else if(x.o===2)r.sal-=x.kg;else if(x.o===3)r.aj+=x.kg;else r.ini+=x.kg}});
    r.fin=r.ini+r.ent-r.sal+r.aj;out.push(r)}return out}

function calEvents(){var ms=idx().ms,t=today(),o={};function push(d,x){if(!d)return;(o[d]=o[d]||[]).push(x)}

    push(p.fechaSol,{c:'sol',txt:'Sol. '+p.numero,p:p,k:'Solicitud de P.O.',q:fmt(num(p.sacos))+' sacos ('+fmt(num(p.sacos)*ks)+' kg)'});

    p.recibos.forEach(function(r){push(r.fecha,{c:'rec',txt:'Rec. '+p.numero,p:p,k:'Recibido',q:fmt(num(r.sacos))+' sacos ('+fmt(num(r.sacos)*ks)+' kg)'})})});return o}

  return '<label class="f'+(f.w?' w':'')+'"><span>'+esc(f.l)+(f.req?' *':'')+'</span>'+inp+(f.hint?'<em>'+esc(f.hint)+'</em>':'')+'</label>'}
